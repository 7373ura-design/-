<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3b72a3"/>
      <stop offset="0.55" stop-color="#2a5b86"/>
      <stop offset="1" stop-color="#1e3a5c"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#1e3a5c"/>
      <stop offset="1" stop-color="#244568"/>
    </linearGradient>
  </defs>
  <!-- the swell builds slowly from the left, steepens, and the crest throws forward -->
  <path fill="#1e3a5c" d="M0 320V296C120 292 210 280 270 254C330 228 356 176 386 126C410 86 440 62 478 58C512 55 540 70 556 96C568 116 570 140 560 156C552 168 540 172 532 166C548 150 548 122 532 106C516 90 492 86 472 94C442 106 428 140 430 180C433 228 470 266 544 288C580 298 616 302 640 302V320Z"/>
  <!-- the face under the lip: lighter, with light passing through the water -->
  <path fill="url(#face)" d="M430 180C428 140 442 106 472 94C492 86 516 90 532 106C512 104 490 112 478 132C464 156 466 196 486 230C502 256 526 276 560 292C548 290 544 288 544 288C470 266 433 228 430 180Z"/>
  <!-- streaks on the face, following its curve -->
  <g fill="none" stroke="#f6efe3" stroke-linecap="round" opacity=".28" stroke-width="1.6">
    <path d="M446 150C446 196 470 236 516 268"/>
    <path d="M458 128C452 176 474 222 522 256"/>
    <path d="M440 176C446 214 468 244 500 266"/>
  </g>
  <!-- foam: a ragged rim along the crest and the falling lip -->
  <path fill="#f6efe3" d="M386 126C410 86 440 62 478 58C512 55 540 70 556 96C568 116 570 140 560 156C552 168 540 172 532 166C544 154 548 136 542 120C538 130 530 134 524 130C530 116 524 100 512 92C512 104 504 110 496 106C498 92 488 82 474 80C476 90 470 96 462 94C460 84 450 78 438 80C440 88 434 94 426 92C424 82 414 78 404 82C400 98 392 112 386 126Z"/>
  <!-- spray off the lip -->
  <g fill="#f6efe3"><circle cx="574" cy="118" r="3.2"/><circle cx="584" cy="134" r="2.2"/><circle cx="578" cy="152" r="1.6"/><circle cx="566" cy="96" r="2.4"/><circle cx="590" cy="112" r="1.4"/></g>
  <!-- whitewater where the lip lands, trailing along the base -->
  <path fill="#f6efe3" opacity=".9" d="M492 276C520 290 566 298 628 300C604 306 540 304 500 292C480 286 478 276 492 276Z"/>
  <path fill="#f6efe3" opacity=".5" d="M360 290C390 284 420 284 444 290C420 294 388 296 360 290Z"/>
</svg>
