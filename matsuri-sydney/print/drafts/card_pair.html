<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
.row{display:flex;gap:10mm}
.col p{font-size:8pt;color:#777;margin-bottom:2mm}
.card{width:90mm;height:55mm;box-shadow:0 1mm 4mm rgba(0,0,0,.15);position:relative;overflow:hidden;background:var(--cream)}
.a{position:absolute}
.mk{position:absolute;right:-16mm;top:50%;transform:translateY(-50%);width:58mm}
.txt{position:absolute;left:6.5mm;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.min{font-family:'Shippori Mincho';font-weight:500;color:var(--navy);font-size:15.5pt;letter-spacing:.06em;margin-top:4.5mm}
.line{width:42mm;height:.35mm;margin:2mm 0;background:var(--red)}
.role{font-family:'Jost';font-size:5.8pt;letter-spacing:.28em;color:var(--muted)}
.back{background:var(--navy);padding:6.5mm 7mm;display:flex;gap:6mm}
.info{flex:1;display:flex;flex-direction:column;position:relative}
dl{margin-top:auto;display:grid;grid-template-columns:auto 1fr;column-gap:3.2mm;row-gap:1.6mm;align-items:baseline}
dt{font-family:'Jost';font-size:4.6pt;letter-spacing:.24em;color:#9fb3cc}
dd{font-size:6.8pt;color:#fff}
.qrs{display:flex;flex-direction:column;justify-content:space-between;position:relative}
.qrs div{display:flex;flex-direction:column;align-items:center;font-family:'Jost';font-size:4.4pt;letter-spacing:.24em;color:#c9d3df}
.qrs img{width:15mm;background:#fff;padding:1mm;margin-bottom:.7mm}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><pattern id="sg" width="24" height="12" patternUnits="userSpaceOnUse"><g fill="none" stroke="#2b5288" stroke-width="1"><circle cx="12" cy="12" r="11"/><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="4"/><circle cx="0" cy="6" r="11"/><circle cx="0" cy="6" r="7.5"/><circle cx="0" cy="6" r="4"/><circle cx="24" cy="6" r="11"/><circle cx="24" cy="6" r="7.5"/><circle cx="24" cy="6" r="4"/></g></pattern></defs></svg>
<div class="row">
 <div class="col"><p>表：白のシンプル（前に良かった形）</p><div class="card">
  <img class="mk" src="mark.png">
  <div class="txt"><img src="wordmark.png" style="height:6.4mm;align-self:flex-start"><div class="min">Nanami Ura</div><div class="line"></div><div class="role">FOUNDER · NAMI STUDIO</div></div></div></div>
 <div class="col"><p>裏：紺×青海波に、情報とQR</p><div class="card back">
  <svg class="a" style="inset:0" width="90mm" height="55mm"><rect width="100%" height="100%" fill="url(#sg)"/></svg>
  <div class="info"><img src="wordmark_cream.png" style="height:4mm;align-self:flex-start"><div style="font-family:Jost;font-size:5pt;letter-spacing:.3em;color:#c9d3df;margin-top:1.6mm">JAPANDI INTERIOR DESIGN · SYDNEY</div>
   <div style="width:10mm;height:.35mm;background:var(--red);margin-top:2.4mm"></div>
   <dl><dt>EMAIL</dt><dd>hello@nami-studio.com.au</dd><dt>PHONE</dt><dd>0406 880 243</dd><dt>WEB</dt><dd>nami-studio.com.au</dd><dt>INSTA</dt><dd>@nami.studio_au</dd></dl></div>
  <div class="qrs"><div><img src="qr_ig.png">INSTAGRAM</div><div><img src="qr_web.png">WEBSITE</div></div></div></div>
</div></body></html>
