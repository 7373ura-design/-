<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
.grid{display:grid;grid-template-columns:90mm 90mm;gap:9mm 10mm}
.col p{font-size:8pt;color:#777;margin-bottom:2mm}
.card{width:90mm;height:55mm;box-shadow:0 1mm 4mm rgba(0,0,0,.15);position:relative;overflow:hidden;background:var(--cream)}
.a{position:absolute}
.mk{position:absolute;right:-16mm;top:50%;transform:translateY(-50%);width:58mm}
.txt{position:absolute;left:6.5mm;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.min{font-family:'Shippori Mincho';font-weight:500;color:var(--navy);font-size:15.5pt;letter-spacing:.06em;margin-top:4.5mm}
.line{width:42mm;height:.35mm;margin:2mm 0;background:var(--red)}
.role{font-family:'Jost';font-size:5.8pt;letter-spacing:.28em;color:var(--muted)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
 <pattern id="p1" width="24" height="12" patternUnits="userSpaceOnUse"><g fill="none" stroke="#ece3d0" stroke-width="1.1"><circle cx="12" cy="12" r="11"/><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="4"/><circle cx="0" cy="6" r="11"/><circle cx="0" cy="6" r="7.5"/><circle cx="0" cy="6" r="4"/><circle cx="24" cy="6" r="11"/><circle cx="24" cy="6" r="7.5"/><circle cx="24" cy="6" r="4"/></g></pattern>
 <pattern id="p2" width="24" height="12" patternUnits="userSpaceOnUse"><g fill="none" stroke="#b9dbe7" stroke-width="1.1"><circle cx="12" cy="12" r="11"/><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="4"/><circle cx="0" cy="6" r="11"/><circle cx="0" cy="6" r="7.5"/><circle cx="0" cy="6" r="4"/><circle cx="24" cy="6" r="11"/><circle cx="24" cy="6" r="7.5"/><circle cx="24" cy="6" r="4"/></g></pattern>
 <pattern id="p3" width="24" height="12" patternUnits="userSpaceOnUse"><g fill="none" stroke="#FBF6EC" stroke-width="1.1"><circle cx="12" cy="12" r="11"/><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="4"/><circle cx="0" cy="6" r="11"/><circle cx="0" cy="6" r="7.5"/><circle cx="0" cy="6" r="4"/><circle cx="24" cy="6" r="11"/><circle cx="24" cy="6" r="7.5"/><circle cx="24" cy="6" r="4"/></g></pattern>
</defs></svg>
<div class="grid">
 <div class="col"><p>1：白地に、白に近いベージュの柄（ほぼ透かし）</p><div class="card">
  <svg class="a" style="inset:0" width="90mm" height="55mm"><rect width="100%" height="100%" fill="url(#p1)"/></svg>
  <img class="mk" src="mark.png">
  <div class="txt"><img src="wordmark.png" style="height:6.4mm;align-self:flex-start"><div class="min">Nanami Ura</div><div class="line"></div><div class="role">FOUNDER · NAMI STUDIO</div></div></div></div>

 <div class="col"><p>2：マークのまわりだけ、水色の柄を丸く</p><div class="card">
  <div class="a" style="right:-30mm;top:50%;transform:translateY(-50%);width:86mm;height:86mm;border-radius:50%;overflow:hidden;-webkit-mask-image:radial-gradient(circle,#000 45%,transparent 70%);mask-image:radial-gradient(circle,#000 45%,transparent 70%)">
   <svg width="100%" height="100%"><rect width="100%" height="100%" fill="url(#p2)"/></svg></div>
  <img class="mk" src="mark.png">
  <div class="txt"><img src="wordmark.png" style="height:6.4mm;align-self:flex-start"><div class="min">Nanami Ura</div><div class="line"></div><div class="role">FOUNDER · NAMI STUDIO</div></div></div></div>

 <div class="col"><p>3：下のふちに、紺の柄の帯を細く</p><div class="card">
  <div class="a" style="left:0;right:0;bottom:0;height:5mm;background:var(--navy)"><svg width="100%" height="100%"><rect width="100%" height="100%" fill="url(#p3)" opacity=".18"/></svg></div>
  <div class="a" style="left:0;right:0;bottom:5mm;height:.4mm;background:var(--red)"></div>
  <img class="mk" src="mark.png" style="top:calc(50% - 2.5mm)">
  <div class="txt" style="bottom:5mm"><img src="wordmark.png" style="height:6.4mm;align-self:flex-start"><div class="min">Nanami Ura</div><div class="line"></div><div class="role">FOUNDER · NAMI STUDIO</div></div></div></div>

 <div class="col"><p>4：白地のまま（柄は印刷ではなく「型押し」で入れる想定）</p><div class="card">
  <svg class="a" style="inset:0;filter:drop-shadow(0 .15mm 0 rgba(255,255,255,.9)) drop-shadow(0 -.12mm 0 rgba(0,0,0,.05))" width="90mm" height="55mm"><rect width="100%" height="100%" fill="url(#p1)" opacity=".8"/></svg>
  <img class="mk" src="mark.png">
  <div class="txt"><img src="wordmark.png" style="height:6.4mm;align-self:flex-start"><div class="min">Nanami Ura</div><div class="line"></div><div class="role">FOUNDER · NAMI STUDIO</div></div></div></div>
</div></body></html>
