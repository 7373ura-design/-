<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
.grid{display:grid;grid-template-columns:90mm 90mm;gap:9mm 10mm}
.col p{font-size:8pt;color:#777;margin-bottom:2mm}
.card{width:90mm;height:55mm;background:var(--cream);box-shadow:0 1mm 4mm rgba(0,0,0,.15);position:relative;overflow:hidden}
.card::after{content:"";position:absolute;right:-13mm;top:50%;transform:translateY(-50%);width:50mm;height:50mm;background:url(mark.png) center/contain no-repeat;z-index:1}
.min{font-family:'Shippori Mincho';font-weight:500;color:var(--navy)}
.role{font-family:'Jost';color:var(--muted);font-size:5.4pt;letter-spacing:.32em}
.abs{position:absolute;left:7mm}
.red{background:var(--red)}
.foot{position:absolute;left:7mm;bottom:6mm;display:flex;align-items:center;gap:1.6mm}
.foot img{height:2.8mm}.foot span{font-family:'Jost';color:var(--muted);font-size:4.6pt;letter-spacing:.4em}
</style></head><body>
<div class="grid">
 <div class="col"><p>D（1行）：横線をマークまで伸ばす</p><div class="card">
  <div class="abs" style="top:17mm"><div class="min" style="font-size:14pt;letter-spacing:.1em">Nanami Ura</div></div>
  <div class="red" style="position:absolute;left:7mm;right:30mm;top:27.5mm;height:.3mm"></div>
  <div class="abs role" style="top:30mm">INTERIOR DESIGNER</div>
  <div class="foot"><img src="wordmark.png"><span>STUDIO</span></div></div></div>
 <div class="col"><p>F（1行）：縦線を上端から下端まで</p><div class="card">
  <div class="red" style="position:absolute;left:7mm;top:0;bottom:0;width:.35mm"></div>
  <div style="position:absolute;left:11mm;top:17mm"><div class="min" style="font-size:14pt;letter-spacing:.1em">Nanami Ura</div><div class="role" style="margin-top:2.2mm">INTERIOR DESIGNER</div></div>
  <div style="position:absolute;left:11mm;bottom:6mm;display:flex;align-items:center;gap:1.6mm"><img src="wordmark.png" style="height:2.8mm"><span style="font-family:Jost;color:var(--muted);font-size:4.6pt;letter-spacing:.4em">STUDIO</span></div></div></div>
 <div class="col"><p>D（1行・大文字）</p><div class="card">
  <div class="abs" style="top:17.5mm"><div class="min" style="font-size:12pt;letter-spacing:.14em">NANAMI URA</div></div>
  <div class="red" style="position:absolute;left:7mm;right:30mm;top:27.5mm;height:.3mm"></div>
  <div class="abs role" style="top:30mm">INTERIOR DESIGNER</div>
  <div class="foot"><img src="wordmark.png"><span>STUDIO</span></div></div></div>
 <div class="col"><p>F（1行・大文字）</p><div class="card">
  <div class="red" style="position:absolute;left:7mm;top:0;bottom:0;width:.35mm"></div>
  <div style="position:absolute;left:11mm;top:17.5mm"><div class="min" style="font-size:12pt;letter-spacing:.14em">NANAMI URA</div><div class="role" style="margin-top:2.2mm">INTERIOR DESIGNER</div></div>
  <div style="position:absolute;left:11mm;bottom:6mm;display:flex;align-items:center;gap:1.6mm"><img src="wordmark.png" style="height:2.8mm"><span style="font-family:Jost;color:var(--muted);font-size:4.6pt;letter-spacing:.4em">STUDIO</span></div></div></div>
</div></body></html>
