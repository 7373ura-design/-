<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
.wrap{display:flex;gap:10mm}
.card{width:90mm;height:55mm;background:var(--cream);box-shadow:0 1mm 4mm rgba(0,0,0,.15);position:relative;overflow:hidden}
.front{padding:6mm 6.5mm;display:flex;flex-direction:column}
.front .logo{display:flex;align-items:center;gap:2.6mm}
.front .logo img.m{width:11mm}.front .logo img.w{height:5.2mm}
.front .studio{font-size:5.2pt;letter-spacing:.32em;color:var(--muted);margin-top:.6mm}
.front .name{font-size:12pt;margin-top:auto}
.front .role{font-size:6.2pt;color:var(--muted);letter-spacing:.06em;margin-top:.4mm}
.front .contact{margin-top:2.6mm;padding-top:2mm;border-top:.25mm solid var(--line);font-size:6.2pt;line-height:1.6;display:grid;grid-template-columns:auto 1fr;column-gap:3mm}
.front .contact b{color:var(--navy);font-weight:500}
.front .dot{position:absolute;right:6.5mm;top:6mm;width:3mm;height:3mm;border-radius:50%;background:var(--red)}
.back{display:flex}
.back .art{width:47mm;height:55mm;background:url(surf.png) 38% center/cover}
.back .side{flex:1;padding:4.5mm 4mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.back .tag{font-size:7.4pt;line-height:1.3}
.back .qrs{display:flex;gap:3mm;margin-top:auto}
.back .qrs div{display:flex;flex-direction:column;align-items:center}
.back .qrs img{width:16mm}
.back .h{font-size:5.4pt;color:var(--navy);margin-top:1mm;font-weight:500}
.back .s{font-size:4.6pt;color:var(--muted);margin-top:.3mm;line-height:1.3}
</style></head><body>
<p class="lbl">名刺 試作（90×55mm）　左：表面　右：裏面 ／ 名前・Instagram QRは仮</p>
<div class="wrap">
<div class="card front">
  <div class="logo"><img class="m" src="mark.png"><div><img class="w" src="wordmark.png"><div class="studio">STUDIO</div></div></div>
  <div class="name serif">Your Name</div>
  <div class="role">Founder · Interior &amp; Garden Designer</div>
  <div class="contact"><b>E</b><span>hello@nami-studio.com.au</span><b>M</b><span>0406 880 243</span><b>W</b><span>nami-studio.com.au</span></div>
</div>
<div class="card back">
  <div class="art"></div>
  <div class="side">
    <div class="tag serif">A new wave<br>of Japandi<br>in Sydney.</div>
    <div class="qrs">
      <div><img src="qr_ig.png"><div class="h">Instagram</div><div class="s">DIY ideas</div></div>
      <div><img src="qr_web.png"><div class="h">Website</div><div class="s">Our homes</div></div>
    </div>
  </div>
</div>
</div></body></html>
