<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
.grid{display:grid;grid-template-columns:90mm 90mm;gap:9mm 10mm}
.col p{font-size:8pt;color:#777;margin-bottom:2mm}
.card{width:90mm;height:55mm;background:var(--cream);box-shadow:0 1mm 4mm rgba(0,0,0,.15);position:relative;overflow:hidden}
.mk{position:absolute;top:50%;transform:translateY(-50%)}
.min{font-family:'Shippori Mincho';font-weight:500;color:var(--navy)}
.role{font-family:'Jost';color:var(--muted);font-size:5.6pt;letter-spacing:.28em}
.red{background:var(--red)}
.blk{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
</style></head><body>
<div class="grid">
 <div class="col"><p>1：Dを詰めて、ひとかたまりに</p><div class="card">
  <img class="mk" src="mark.png" style="right:-13mm;width:50mm">
  <div class="blk" style="left:7mm">
   <img src="wordmark.png" style="height:5.4mm;align-self:flex-start">
   <div class="min" style="font-size:14pt;letter-spacing:.08em;margin-top:5mm">Nanami Ura</div>
   <div class="red" style="width:46mm;height:.3mm;margin:2.2mm 0"></div>
   <div class="role">FOUNDER · NAMI STUDIO</div></div></div></div>

 <div class="col"><p>2：Fを詰めて、ひとかたまりに</p><div class="card">
  <img class="mk" src="mark.png" style="right:-13mm;width:50mm">
  <div class="red" style="position:absolute;left:7mm;top:0;bottom:0;width:.35mm"></div>
  <div class="blk" style="left:11mm">
   <img src="wordmark.png" style="height:5.4mm;align-self:flex-start">
   <div class="min" style="font-size:14pt;letter-spacing:.08em;margin-top:5mm">Nanami Ura</div>
   <div class="role" style="margin-top:1.8mm">FOUNDER · NAMI STUDIO</div></div></div></div>

 <div class="col"><p>3：マークを大きく、文字も大きく（余白を減らす）</p><div class="card">
  <img class="mk" src="mark.png" style="right:-16mm;width:58mm">
  <div class="blk" style="left:6.5mm">
   <img src="wordmark.png" style="height:6.4mm;align-self:flex-start">
   <div class="min" style="font-size:15.5pt;letter-spacing:.06em;margin-top:4.5mm">Nanami Ura</div>
   <div class="red" style="width:42mm;height:.35mm;margin:2mm 0"></div>
   <div class="role" style="font-size:5.8pt">FOUNDER · NAMI STUDIO</div></div></div></div>

 <div class="col"><p>4：肩書きを2行にして下まで使う</p><div class="card">
  <img class="mk" src="mark.png" style="right:-13mm;width:50mm">
  <div class="blk" style="left:7mm">
   <img src="wordmark.png" style="height:5.4mm;align-self:flex-start">
   <div class="min" style="font-size:14pt;letter-spacing:.08em;margin-top:5mm">Nanami Ura</div>
   <div class="red" style="width:46mm;height:.3mm;margin:2.2mm 0"></div>
   <div class="role" style="color:var(--navy)">FOUNDER</div>
   <div class="role" style="margin-top:1mm;letter-spacing:.18em">NAMI Studio — Japandi Interior Design</div></div></div></div>
</div></body></html>
